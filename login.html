<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sirski Transport — Member Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        linear-gradient(rgba(0,0,0,0.82), rgba(0,0,0,0.92)),
        url("truck01.jpeg") center/cover fixed;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 430px;
    }

    .login-box {
      background: rgba(15, 15, 15, 0.96);
      border: 1px solid #333;
      border-radius: 16px;
      padding: 35px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      text-align: center;
    }

    .logo {
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin-bottom: 15px;
    }

    h1 {
      margin: 5px 0;
      font-size: 28px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 30px;
    }

    label {
      display: block;
      text-align: left;
      margin: 15px 0 7px;
      color: #ddd;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #f5c400;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      background: #f5c400;
      color: #111;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #ffd633;
    }

    .secondary {
      background: #222;
      color: white;
      border: 1px solid #555;
      margin-top: 12px;
    }

    .secondary:hover {
      background: #333;
    }

    #message {
      margin-top: 18px;
      padding: 10px;
      border-radius: 7px;
      display: none;
      font-size: 14px;
    }

    .success {
      background: rgba(40, 167, 69, 0.2);
      color: #7dff9a;
      border: 1px solid #2e8b46;
    }

    .error {
      background: rgba(220, 53, 69, 0.2);
      color: #ff8995;
      border: 1px solid #a52a36;
    }

    .back {
      display: inline-block;
      margin-top: 25px;
      color: #f5c400;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      text-decoration: underline;
    }

    .small-note {
      margin-top: 20px;
      color: #777;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="login-container">

    <div class="login-box">

      <img
        src="Sirski_Transport_Logo.png"
        alt="Sirski Transport Logo"
        class="logo"
      >

      <h1>Sirski Transport VTC</h1>

      <div class="subtitle">
        Member Login
      </div>

      <form id="loginForm">

        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        >

        <button type="submit">
          Member Login
        </button>

      </form>

      <button
        type="button"
        class="secondary"
        id="signupButton"
      >
        Create Member Account
      </button>

      <div id="message"></div>

      <a href="index.html" class="back">
        ← Back to Gallery
      </a>

      <div class="small-note">
        Sirski Transport Gallery — Project 2
      </div>

    </div>

  </div>

  <script>

    const SUPABASE_URL =
      "https://siedpigixmtmmihdsqpj.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_OgFfAMNztlZ2cJwALHTfPQ_XxqHi3er";

    const { createClient } =
      supabase;

    const client =
      createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );

    const form =
      document.getElementById("loginForm");

    const signupButton =
      document.getElementById("signupButton");

    const message =
      document.getElementById("message");


    function showMessage(text, type) {

      message.textContent = text;

      message.className = type;

      message.style.display = "block";
    }


    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      showMessage("Signing in...", "success");

      const { data, error } =
        await client.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {

        showMessage(
          error.message,
          "error"
        );

        return;
      }

      showMessage(
        "Login successful. Opening member area...",
        "success"
      );

      setTimeout(function() {

        window.location.href =
          "submit.html";

      }, 1000);

    });


    signupButton.addEventListener("click", async function() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      if (!email || !password) {

        showMessage(
          "Enter your email and password first.",
          "error"
        );

        return;
      }

      if (password.length < 6) {

        showMessage(
          "Password must be at least 6 characters.",
          "error"
        );

        return;
      }

      showMessage(
        "Creating your member account...",
        "success"
      );

      const { error } =
        await client.auth.signUp({
          email: email,
          password: password
        });

      if (error) {

        showMessage(
          error.message,
          "error"
        );

        return;
      }

      showMessage(
        "Account created. Please check your email and confirm your account before logging in.",
        "success"
      );

    });

  </script>

</body>
</html>
