<script>

  const SUPABASE_URL =
    "https://siedpigixmtmmihdsqpj.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_OgFfAMNztlZ2cJwALHTfPQ_XxqHi3er";


  const { createClient } = supabase;

  const client =
    createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  const loginSection =
    document.getElementById("loginSection");

  const signupSection =
    document.getElementById("signupSection");

  const loginForm =
    document.getElementById("loginForm");

  const signupForm =
    document.getElementById("signupForm");

  const showSignup =
    document.getElementById("showSignup");

  const showLogin =
    document.getElementById("showLogin");

  const message =
    document.getElementById("message");


  function showMessage(text, type) {

    message.textContent = text;

    message.className = type;

    message.style.display = "block";
  }


  function clearMessage() {

    message.textContent = "";

    message.style.display = "none";

    message.className = "";
  }


  showSignup.addEventListener("click", function() {

    clearMessage();

    loginSection.classList.add("hidden");

    signupSection.classList.remove("hidden");

  });


  showLogin.addEventListener("click", function() {

    clearMessage();

    signupSection.classList.add("hidden");

    loginSection.classList.remove("hidden");

  });


  // =========================================
  // CHECK EXISTING SESSION
  // =========================================

  async function checkExistingSession() {

    try {

      const {
        data: {
          session
        },
        error
      } =
        await client.auth.getSession();


      if (error) {

        console.error(
          "Unable to check existing session:",
          error
        );

        return;
      }


      // No existing login session.
      // Show the normal login page.

      if (!session || !session.user) {

        return;
      }


      // =========================================
      // CHECK IF EXISTING USER IS GALLERY ADMIN
      // =========================================

      const {
        data: admin,
        error: adminError
      } =
        await client
          .from("gallery_admins")
          .select("user_id")
          .eq("user_id", session.user.id)
          .maybeSingle();


      if (adminError) {

        console.error(
          "Gallery admin check failed:",
          adminError
        );

        return;
      }


      // =========================================
      // EXISTING ADMIN SESSION
      // =========================================

      if (admin) {

        showMessage(
          "Administrator session found. Opening Gallery Administration...",
          "success"
        );


        setTimeout(function() {

          window.location.href =
            "admin.html";

        }, 500);


        return;
      }


      // =========================================
      // EXISTING MEMBER SESSION
      // =========================================

      showMessage(
        "Member session found. Opening member area...",
        "success"
      );


      setTimeout(function() {

        window.location.href =
          "submit.html";

      }, 500);

    } catch (error) {

      console.error(
        "Existing session check failed:",
        error
      );

    }

  }


  // =========================================
  // MEMBER LOGIN
  // =========================================

  loginForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      clearMessage();


      const email =
        document
          .getElementById("loginEmail")
          .value
          .trim();


      const password =
        document
          .getElementById("loginPassword")
          .value;


      showMessage(
        "Signing in...",
        "success"
      );


      const {
        data,
        error
      } =
        await client.auth.signInWithPassword({

          email: email,

          password: password

        });


      if (error) {

        showMessage(
          error.message,
          "error"
        );

        return;
      }


      if (!data || !data.user) {

        showMessage(
          "Login succeeded, but the user account could not be identified.",
          "error"
        );

        return;
      }


      // =========================================
      // CHECK PROJECT 2 GALLERY ADMIN
      // =========================================

      const {
        data: admin,
        error: adminError
      } =
        await client
          .from("gallery_admins")
          .select("user_id")
          .eq("user_id", data.user.id)
          .maybeSingle();


      if (adminError) {

        console.error(
          "Gallery admin check failed:",
          adminError
        );


        showMessage(
          "Login successful, but administrator access could not be verified. Please try again.",
          "error"
        );


        await client.auth.signOut();

        return;
      }


      // =========================================
      // ADMIN → ADMIN DASHBOARD
      // =========================================

      if (admin) {

        showMessage(
          "Administrator login successful. Opening Gallery Administration...",
          "success"
        );


        setTimeout(function() {

          window.location.href =
            "admin.html";

        }, 700);


        return;
      }


      // =========================================
      // NORMAL MEMBER → MEMBER AREA
      // =========================================

      showMessage(
        "Login successful. Opening member area...",
        "success"
      );


      setTimeout(function() {

        window.location.href =
          "submit.html";

      }, 1000);

    }
  );


  // =========================================
  // MEMBER REGISTRATION
  // =========================================

  signupForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      clearMessage();


      const sirskiName =
        document
          .getElementById("sirskiName")
          .value
          .trim();


      const email =
        document
          .getElementById("signupEmail")
          .value
          .trim();


      const password =
        document
          .getElementById("signupPassword")
          .value;


      if (!sirskiName) {

        showMessage(
          "Please enter your Sirski Driver Name.",
          "error"
        );

        return;
      }


      if (password.length < 6) {

        showMessage(
          "Password must be at least 6 characters.",
          "error"
        );

        return;
      }


      showMessage(
        "Creating your member account...",
        "success"
      );


      // =========================================
      // CREATE PROJECT 2 MEMBER ACCOUNT
      // =========================================

      const {
        data,
        error
      } =
        await client.auth.signUp({

          email: email,

          password: password,

          options: {

            data: {

              sirski_name: sirskiName

            }

          }

        });


      if (error) {

        showMessage(
          error.message,
          "error"
        );

        return;
      }


      if (!data.user) {

        showMessage(
          "Account creation did not return a user.",
          "error"
        );

        return;
      }


      showMessage(
        "Account created successfully. Please check your Sirski Transport email and confirm your account before logging in.",
        "success"
      );


      signupForm.reset();

    }
  );


  // =========================================
  // START EXISTING SESSION CHECK
  // =========================================

  checkExistingSession();

</script>
