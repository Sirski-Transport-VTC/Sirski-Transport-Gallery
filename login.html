<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sirski Transport — Member Login</title>

  <!-- Project 2 Supabase Browser Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        linear-gradient(rgba(0,0,0,0.82), rgba(0,0,0,0.92)),
        url("truck01.jpeg") center/cover fixed;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 450px;
    }

    .login-box {
      background: rgba(15, 15, 15, 0.96);
      border: 1px solid #333;
      border-radius: 16px;
      padding: 35px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }

    .logo {
      display: block;
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin: 0 auto 15px;
    }

    h1 {
      margin: 5px 0;
      text-align: center;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    .section-title {
      color: #f5c400;
      font-size: 18px;
      margin: 0 0 15px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      color: #ddd;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #f5c400;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      background: #f5c400;
      color: #111;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #ffd633;
    }

    .secondary {
      background: #222;
      color: white;
      border: 1px solid #555;
      margin-top: 12px;
    }

    .secondary:hover {
      background: #333;
    }

    .hidden {
      display: none;
    }

    .divider {
      height: 1px;
      background: #333;
      margin: 28px 0;
    }

    #message {
      margin-top: 18px;
      padding: 10px;
      border-radius: 7px;
      display: none;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      background: rgba(40, 167, 69, 0.2);
      color: #7dff9a;
      border: 1px solid #2e8b46;
    }

    .error {
      background: rgba(220, 53, 69, 0.2);
      color: #ff8995;
      border: 1px solid #a52a36;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #f5c400;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      text-decoration: underline;
    }

    .small-note {
      margin-top: 20px;
      color: #777;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="login-container">

  <div class="login-box">

    <img
      src="Sirski_Transport_Logo.png"
      alt="Sirski Transport Logo"
      class="logo"
    >

    <h1>Sirski Transport VTC</h1>

    <div class="subtitle">
      Project 2 — Member Gallery
    </div>


    <!-- LOGIN -->

    <div id="loginSection">

      <h2 class="section-title">Member Login</h2>

      <form id="loginForm">

        <label for="loginEmail">
          Sirski Transport Email
        </label>

        <input
          type="email"
          id="loginEmail"
          placeholder="driver@sirski-transport.com"
          required
        >

        <label for="loginPassword">
          Password
        </label>

        <input
          type="password"
          id="loginPassword"
          placeholder="Enter your password"
          required
        >

        <button type="submit">
          Member Login
        </button>

      </form>

      <button
        type="button"
        class="secondary"
        id="showSignup"
      >
        Create Member Account
      </button>

    </div>


    <!-- REGISTRATION -->

    <div id="signupSection" class="hidden">

      <h2 class="section-title">Create Member Account</h2>

      <form id="signupForm">

        <label for="sirskiName">
          Sirski Driver Name
        </label>

        <input
          type="text"
          id="sirskiName"
          placeholder="Example: Jigg Banez"
          required
        >

        <label for="signupEmail">
          Sirski Transport Email
        </label>

        <input
          type="email"
          id="signupEmail"
          placeholder="driver@sirski-transport.com"
          required
        >

        <label for="signupPassword">
          Password
        </label>

        <input
          type="password"
          id="signupPassword"
          placeholder="Minimum 6 characters"
          minlength="6"
          required
        >

        <button type="submit">
          Create Member Account
        </button>

      </form>

      <button
        type="button"
        class="secondary"
        id="showLogin"
      >
        ← Back to Member Login
      </button>

    </div>


    <div id="message"></div>

    <div class="divider"></div>

    <a href="index.html" class="back">
      ← Back to Gallery
    </a>

    <div class="small-note">
      Sirski Transport — Driven by Passion. Built on Trust.
      <br>
      Independent Project 2 — Standalone Truck Gallery
    </div>

  </div>

</div>


<script>

  // =========================================
  // PROJECT 2 SUPABASE
  // =========================================

  const SUPABASE_URL =
    "https://siedpigixmtmmihdsqpj.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_OgFfAMNztlZ2cJwALHTfPQ_XxqHi3er";


  const { createClient } = supabase;


  const client =
    createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  // =========================================
  // PAGE ELEMENTS
  // =========================================

  const loginSection =
    document.getElementById("loginSection");

  const signupSection =
    document.getElementById("signupSection");

  const loginForm =
    document.getElementById("loginForm");

  const signupForm =
    document.getElementById("signupForm");

  const showSignup =
    document.getElementById("showSignup");

  const showLogin =
    document.getElementById("showLogin");

  const message =
    document.getElementById("message");


  // =========================================
  // MESSAGE FUNCTIONS
  // =========================================

  function showMessage(text, type) {

    message.textContent = text;

    message.className = type;

    message.style.display = "block";

  }


  function clearMessage() {

    message.textContent = "";

    message.style.display = "none";

    message.className = "";

  }


  // =========================================
  // SHOW SIGNUP
  // =========================================

  showSignup.addEventListener(
    "click",
    function() {

      clearMessage();

      loginSection.classList.add("hidden");

      signupSection.classList.remove("hidden");

    }
  );


  // =========================================
  // SHOW LOGIN
  // =========================================

  showLogin.addEventListener(
    "click",
    function() {

      clearMessage();

      signupSection.classList.add("hidden");

      loginSection.classList.remove("hidden");

    }
  );


  // =========================================
  // CHECK EXISTING SESSION
  // =========================================
  //
  // If the user is already logged in:
  //
  // ADMIN
  // → admin.html
  //
  // NORMAL MEMBER
  // → submit.html
  //
  // If there is no session:
  // stay on normal login page.
  // =========================================

  async function checkExistingSession() {

    try {

      const {
        data: {
          session
        },
        error
      } =
        await client.auth.getSession();


      if (error) {

        console.error(
          "Unable to check existing session:",
          error
        );

        return;
      }


      // No existing session.
      // Keep normal login screen.

      if (!session || !session.user) {

        return;
      }


      // =========================================
      // CHECK PROJECT 2 ADMIN TABLE
      // =========================================

      const {
        data: admin,
        error: adminError
      } =
        await client
          .from("gallery_admins")
          .select("user_id")
          .eq("user_id", session.user.id)
          .maybeSingle();


      if (adminError) {

        console.error(
          "Gallery admin check failed:",
          adminError
        );

        return;
      }


      // =========================================
      // EXISTING ADMIN SESSION
      // =========================================

      if (admin) {

        showMessage(
          "Administrator session found. Opening Gallery Administration...",
          "success"
        );


        setTimeout(
          function() {

            window.location.href =
              "admin.html";

          },
          500
        );


        return;
      }


      // =========================================
      // EXISTING NORMAL MEMBER SESSION
      // =========================================

      showMessage(
        "Member session found. Opening member area...",
        "success"
      );


      setTimeout(
        function() {

          window.location.href =
            "submit.html";

        },
        500
      );

    } catch (error) {

      console.error(
        "Existing session check failed:",
        error
      );

    }

  }


  // =========================================
  // MEMBER LOGIN
  // =========================================

  loginForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      clearMessage();


      const email =
        document
          .getElementById("loginEmail")
          .value
          .trim();


      const password =
        document
          .getElementById("loginPassword")
          .value;


      showMessage(
        "Signing in...",
        "success"
      );


      const {
        data,
        error
      } =
        await client.auth.signInWithPassword({

          email: email,

          password: password

        });


      if (error) {

        showMessage(
          error.message,
          "error"
        );

        return;
      }


      if (!data || !data.user) {

        showMessage(
          "Login succeeded, but the user account could not be identified.",
          "error"
        );

        return;
      }


      // =========================================
      // CHECK IF LOGGED-IN USER IS ADMIN
      // =========================================

      const {
        data: admin,
        error: adminError
      } =
        await client
          .from("gallery_admins")
          .select("user_id")
          .eq("user_id", data.user.id)
          .maybeSingle();


      if (adminError) {

        console.error(
          "Gallery admin check failed:",
          adminError
        );


        showMessage(
          "Login successful, but administrator access could not be verified. Please try again.",
          "error"
        );


        await client.auth.signOut();

        return;
      }


      // =========================================
      // ADMIN → ADMIN DASHBOARD
      // =========================================

      if (admin) {

        showMessage(
          "Administrator login successful. Opening Gallery Administration...",
          "success"
        );


        setTimeout(
          function() {

            window.location.href =
              "admin.html";

          },
          700
        );


        return;
      }


      // =========================================
      // NORMAL MEMBER → MEMBER AREA
      // =========================================

      showMessage(
        "Login successful. Opening member area...",
        "success"
      );


      setTimeout(
        function() {

          window.location.href =
            "submit.html";

        },
        1000
      );

    }
  );


  // =========================================
  // MEMBER REGISTRATION
  // =========================================
  //
  // The Sirski Driver Name is stored in
  // Supabase Auth metadata.
  //
  // Project 2's database trigger automatically
  // creates the member_profiles record.
  //
  // DO NOT manually insert member_profiles here.
  // =========================================

  signupForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      clearMessage();


      const sirskiName =
        document
          .getElementById("sirskiName")
          .value
          .trim();


      const email =
        document
          .getElementById("signupEmail")
          .value
          .trim();


      const password =
        document
          .getElementById("signupPassword")
          .value;


      if (!sirskiName) {

        showMessage(
          "Please enter your Sirski Driver Name.",
          "error"
        );

        return;
      }


      if (password.length < 6) {

        showMessage(
          "Password must be at least 6 characters.",
          "error"
        );

        return;
      }


      showMessage(
        "Creating your member account...",
        "success"
      );


      // =========================================
      // CREATE AUTH ACCOUNT
      // =========================================

      const {
        data,
        error
      } =
        await client.auth.signUp({

          email: email,

          password: password,

          options: {

            data: {

              sirski_name: sirskiName

            }

          }

        });


      if (error) {

        showMessage(
          error.message,
          "error"
        );

        return;
      }


      if (!data.user) {

        showMessage(
          "Account creation did not return a user.",
          "error"
        );

        return;
      }


      showMessage(
        "Account created successfully. Please check your Sirski Transport email and confirm your account before logging in.",
        "success"
      );


      signupForm.reset();

    }
  );


  // =========================================
  // START
  // =========================================

  checkExistingSession();

</script>

</body>
</html>
