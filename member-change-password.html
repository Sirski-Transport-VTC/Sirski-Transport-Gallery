<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sirski Transport — Change Password</title>
<link rel="stylesheet" href="project2-v2.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.password-panel{max-width:620px;margin:30px auto 0}
.help{color:#999;line-height:1.6;font-size:14px}
</style>
</head>
<body>
<header class="top">
  <div class="nav">
    <div class="brand">
      <img src="Sirski_Transport_Logo.png" alt="Sirski Transport">
      <span>SIRSKI</span> CHANGE PASSWORD
    </div>
    <a class="btn dark" href="member-dashboard.html">Member Dashboard</a>
  </div>
</header>
<main class="wrap">
  <p class="eyebrow">MEMBER SECURITY</p>
  <h1>Change Password</h1>
  <p class="muted">Create a new password for your Sirski Transport Gallery account.</p>

  <section class="panel password-panel">
    <div id="emailBox" class="limit">Checking account...</div>

    <form id="form">
      <div class="field">
        <label for="password">New Password</label>
        <input id="password" type="password" minlength="6" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label for="confirm">Confirm New Password</label>
        <input id="confirm" type="password" minlength="6" autocomplete="new-password" required>
      </div>
      <button id="button" class="btn" type="submit">CHANGE PASSWORD</button>
    </form>
    <div id="message" class="msg"></div>
    <p class="help">Your password is changed directly through Supabase Auth. The password is never stored in this page.</p>
  </section>
</main>
<script>
const client=supabase.createClient(
  "https://siedpigixmtmmihdsqpj.supabase.co",
  "sb_publishable_OgFfAMNztlZ2cJwALHTfPQ_XxqHi3er"
);
const emailBox=document.getElementById("emailBox");
const message=document.getElementById("message");
const button=document.getElementById("button");

function showMessage(text,type){message.textContent=text;message.className="msg "+type;}

async function init(){
  const {data:{session},error}=await client.auth.getSession();
  if(error) throw error;
  if(!session){window.location.href="login.html";return;}
  emailBox.textContent="Signed in as: "+session.user.email;
}

document.getElementById("form").addEventListener("submit",async e=>{
  e.preventDefault();
  const password=document.getElementById("password").value;
  const confirm=document.getElementById("confirm").value;

  if(password.length<6){showMessage("Password must be at least 6 characters.","error");return;}
  if(password!==confirm){showMessage("The passwords do not match.","error");return;}

  button.disabled=true;
  button.textContent="CHANGING PASSWORD...";

  try{
    const {error}=await client.auth.updateUser({password});
    if(error) throw error;
    showMessage("Password changed successfully. Returning to your Member Dashboard...","success");
    setTimeout(()=>window.location.href="member-dashboard.html",1200);
  }catch(error){
    showMessage(error.message||"Unable to change password.","error");
    button.disabled=false;
    button.textContent="CHANGE PASSWORD";
  }
});

init().catch(error=>showMessage(error.message||"Unable to load account.","error"));
</script>
</body>
</html>
