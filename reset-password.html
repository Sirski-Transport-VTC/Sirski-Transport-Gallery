<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sirski Transport — Reset Password</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#090909;color:#eee;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{width:100%;max-width:520px;background:#121212;border:1px solid #303030;border-radius:16px;padding:34px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.logo{display:block;width:100px;height:100px;object-fit:contain;margin:0 auto 15px}
h1{text-align:center;margin:8px 0;color:#f5c400}
p{color:#aaa;line-height:1.6;text-align:center}
label{display:block;margin:18px 0 7px;font-weight:bold}
input{width:100%;padding:14px;background:#080808;color:#fff;border:1px solid #383838;border-radius:9px;font-size:16px}
button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:9px;background:#f5c400;color:#111;font-weight:800;font-size:16px;cursor:pointer}
button:disabled{opacity:.6}
#msg{margin-top:18px;padding:13px;border-radius:9px;display:none;line-height:1.5}
.success{display:block!important;border:1px solid #2c8b48;background:#102417;color:#79e79a}
.error{display:block!important;border:1px solid #a93645;background:#2a1115;color:#ff8b98}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="box">
<img src="Sirski_Transport_Logo.png" class="logo" alt="Sirski Transport">
<h1>Reset Admin Password</h1>
<p>Create a new password for the currently authenticated Sirski Transport account.</p>
<form id="form">
<label for="password">New Password</label>
<input id="password" type="password" minlength="6" autocomplete="new-password" required placeholder="Minimum 6 characters">
<label for="confirm">Confirm Password</label>
<input id="confirm" type="password" minlength="6" autocomplete="new-password" required placeholder="Enter the password again">
<button id="btn" type="submit">SET NEW PASSWORD</button>
</form>
<div id="msg"></div>
</div>
<script>
const SUPABASE_URL="https://siedpigixmtmmihdsqpj.supabase.co";
const SUPABASE_KEY="sb_publishable_OgFfAMNztlZ2cJwALHTfPQ_XxqHi3er";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const form=document.getElementById("form"), msg=document.getElementById("msg"), btn=document.getElementById("btn");
function show(t,c){msg.textContent=t;msg.className=c;msg.style.display="block";}
async function init(){
 try{
  const hash=new URLSearchParams(location.hash.substring(1));
  const access=hash.get("access_token"), refresh=hash.get("refresh_token");
  if(access&&refresh){
   const {error}=await client.auth.setSession({access_token:access,refresh_token:refresh});
   if(error)throw error;
   history.replaceState(null,"",location.pathname);
  }
  const {data,error}=await client.auth.getUser();
  if(error||!data.user)throw new Error("This password-reset link is missing or has expired. Please request a new reset email.");
 }catch(e){
  form.style.display="none";
  show(e.message||"Unable to start password recovery.","error");
 }
}
form.addEventListener("submit",async e=>{
 e.preventDefault();
 const a=document.getElementById("password").value,b=document.getElementById("confirm").value;
 if(a.length<6)return show("Password must be at least 6 characters.","error");
 if(a!==b)return show("The passwords do not match.","error");
 btn.disabled=true;btn.textContent="UPDATING...";
 try{
  const {data:userData}=await client.auth.getUser();
  if(!userData.user)throw new Error("No authenticated recovery session was found.");
  const {error}=await client.auth.updateUser({password:a});
  if(error)throw error;
  show("Password updated successfully. Redirecting to Member Login...","success");
  await client.auth.signOut();
  setTimeout(()=>location.href="login.html?password_reset=1",1200);
 }catch(e){
  show(e.message||"Unable to update password.","error");
  btn.disabled=false;btn.textContent="SET NEW PASSWORD";
 }
});
init();
</script>
</body>
</html>
