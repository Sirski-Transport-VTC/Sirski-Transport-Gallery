<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Activate Sirski Member Account</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:#090909;color:#eee;min-height:100vh}
.top{min-height:78px;border-bottom:1px solid #292929;padding:0 6vw}
.nav{max-width:1100px;margin:auto;display:flex;align-items:center;min-height:78px}
.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:2px}
.brand img{width:46px;height:46px;object-fit:contain}
.brand span{color:#f5c400}
.wrap{max-width:700px;margin:auto;padding:70px 24px}
.eyebrow{color:#f5c400;font-size:12px;font-weight:800;letter-spacing:3px}
h1{font-size:42px;margin:10px 0 12px}
.muted{color:#aaa;line-height:1.6}
.panel{background:#121212;border:1px solid #303030;border-radius:16px;padding:30px;margin-top:30px}
.field{margin:18px 0}
.field label{display:block;margin-bottom:8px;font-weight:700}
.field input{width:100%;padding:14px;background:#080808;color:#fff;border:1px solid #383838;border-radius:9px;font-size:16px}
.btn{width:100%;border:0;border-radius:10px;background:#f5c400;color:#080808;font-weight:800;padding:14px 20px;cursor:pointer;font-size:16px}
.btn:disabled{opacity:.6;cursor:wait}
.msg{margin-top:18px;padding:13px;border-radius:9px;display:none;line-height:1.5}
.msg.success{display:block;border:1px solid #2c8b48;background:#102417;color:#79e79a}
.msg.error{display:block;border:1px solid #a93645;background:#2a1115;color:#ff8b98}
.small{font-size:13px;color:#888;margin-top:18px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="top">
  <div class="nav">
    <div class="brand">
      <img src="Sirski_Transport_Logo.png" alt="Sirski Transport">
      <span>SIRSKI</span> MEMBER ACTIVATION
    </div>
  </div>
</header>

<main class="wrap">
  <p class="eyebrow">WELCOME TO SIRSKI TRANSPORT</p>
  <h1>Activate Your Member Account</h1>
  <p class="muted">
    Your invitation has been accepted. Create your own Sirski Gallery password below.
    No temporary password is required.
  </p>

  <section class="panel">
    <form id="form">
      <div class="field">
        <label for="password">Create Password</label>
        <input id="password" type="password" minlength="6"
               autocomplete="new-password" required
               placeholder="Minimum 6 characters">
      </div>

      <div class="field">
        <label for="confirm">Confirm Password</label>
        <input id="confirm" type="password" minlength="6"
               autocomplete="new-password" required
               placeholder="Enter the password again">
      </div>

      <button id="submit" class="btn" type="submit">
        SET PASSWORD & CONTINUE
      </button>
    </form>

    <div id="msg" class="msg"></div>

    <p class="small">
      This password is for your Sirski Transport Project 2 Gallery account.
    </p>
  </section>
</main>

<script>
const SUPABASE_URL = "https://siedpigixmtmmihdsqpj.supabase.co";
const SUPABASE_KEY = "sb_publishable_OgFfAMNztlZ2cJwALHTfPQ_XxqHi3er";
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const form = document.getElementById("form");
const msg = document.getElementById("msg");
const button = document.getElementById("submit");

function showMessage(text, type){
  msg.textContent = text;
  msg.className = "msg " + type;
}

async function prepareInvitationSession(){
  const hash = new URLSearchParams(window.location.hash.substring(1));
  const accessToken = hash.get("access_token");
  const refreshToken = hash.get("refresh_token");

  if(accessToken && refreshToken){
    const {error} = await client.auth.setSession({
      access_token: accessToken,
      refresh_token: refreshToken
    });
    if(error) throw error;

    // Remove sensitive tokens from the visible URL after the session is established.
    history.replaceState(null, "", window.location.pathname);
  }

  const {data, error} = await client.auth.getSession();
  if(error) throw error;

  if(!data.session){
    throw new Error("This invitation link is missing or has expired. Please ask the Sirski Transport administrator for a new invitation.");
  }
}

async function start(){
  try{
    await prepareInvitationSession();
  }catch(error){
    form.style.display = "none";
    showMessage(error.message || "Unable to activate this invitation.", "error");
  }
}

form.addEventListener("submit", async (event)=>{
  event.preventDefault();

  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;

  if(password.length < 6){
    showMessage("Password must be at least 6 characters.", "error");
    return;
  }

  if(password !== confirm){
    showMessage("The passwords do not match.", "error");
    return;
  }

  button.disabled = true;
  button.textContent = "SETTING PASSWORD...";

  try{
    const {error} = await client.auth.updateUser({password});
    if(error) throw error;

    showMessage("Password created successfully. Redirecting you to Sirski Member Login...", "success");

    setTimeout(()=>{
      window.location.href = "login.html?activated=1";
    }, 1500);

  }catch(error){
    showMessage(error.message || "Unable to set your password.", "error");
    button.disabled = false;
    button.textContent = "SET PASSWORD & CONTINUE";
  }
});

start();
</script>
</body>
</html>
