<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sirski Transport — Admin Password</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#090909;color:#eee;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{width:100%;max-width:520px;background:#121212;border:1px solid #303030;border-radius:16px;padding:34px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.logo{display:block;width:100px;height:100px;object-fit:contain;margin:0 auto 15px}
.eyebrow{text-align:center;color:#f5c400;font-size:12px;font-weight:800;letter-spacing:3px}
h1{text-align:center;margin:8px 0 12px;color:#f5c400}
.note{text-align:center;color:#aaa;line-height:1.6}
.account{text-align:center;margin:18px 0;padding:12px;border:1px solid #333;border-radius:9px;background:#0b0b0b;color:#ddd}
label{display:block;margin:18px 0 7px;font-weight:bold}
input{width:100%;padding:14px;background:#080808;color:#fff;border:1px solid #383838;border-radius:9px;font-size:16px}
button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:9px;background:#f5c400;color:#111;font-weight:800;font-size:16px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.secondary{background:#222;color:#fff;border:1px solid #555}
#msg{margin-top:18px;padding:13px;border-radius:9px;display:none;line-height:1.5}
.success{display:block!important;border:1px solid #2c8b48;background:#102417;color:#79e79a}
.error{display:block!important;border:1px solid #a93645;background:#2a1115;color:#ff8b98}
.small{text-align:center;font-size:12px;color:#777;margin-top:20px;line-height:1.5}
.hidden{display:none}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="box">
  <img src="Sirski_Transport_Logo.png" class="logo" alt="Sirski Transport">
  <div class="eyebrow">GALLERY ADMINISTRATION</div>
  <h1>Admin Password</h1>
  <p class="note">Change the password for the currently signed-in Gallery Administrator.</p>

  <div id="account" class="account hidden"></div>

  <form id="form" class="hidden">
    <label for="password">New Admin Password</label>
    <input id="password" type="password" minlength="6" autocomplete="new-password"
           required placeholder="Minimum 6 characters">

    <label for="confirm">Confirm New Password</label>
    <input id="confirm" type="password" minlength="6" autocomplete="new-password"
           required placeholder="Enter the password again">

    <button id="save" type="submit">CHANGE ADMIN PASSWORD</button>
  </form>

  <button id="back" class="secondary" type="button">← Back to Gallery Administration</button>

  <div id="msg"></div>

  <p class="small">
    This page only changes the password of the account currently signed in.
    It does not change member passwords.
  </p>
</div>

<script>
const SUPABASE_URL = "https://siedpigixmtmmihdsqpj.supabase.co";
const SUPABASE_KEY = "sb_publishable_OgFfAMNztlZ2cJwALHTfPQ_XxqHi3er";
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const form = document.getElementById("form");
const account = document.getElementById("account");
const msg = document.getElementById("msg");
const save = document.getElementById("save");
const back = document.getElementById("back");

function showMessage(text, type) {
  msg.textContent = text;
  msg.className = type;
  msg.style.display = "block";
}

async function init() {
  try {
    const { data: sessionData, error: sessionError } = await client.auth.getSession();
    if (sessionError) throw sessionError;

    const user = sessionData.session?.user;
    if (!user) {
      throw new Error("No administrator session found. Please sign in to Gallery Administration first.");
    }

    const { data: admin, error: adminError } = await client
      .from("gallery_admins")
      .select("user_id")
      .eq("user_id", user.id)
      .maybeSingle();

    if (adminError) throw adminError;

    if (!admin) {
      throw new Error("Administrator access required.");
    }

    account.textContent = "Signed in as: " + (user.email || "Gallery Administrator");
    account.classList.remove("hidden");
    form.classList.remove("hidden");
  } catch (error) {
    showMessage(error.message || "Unable to verify administrator access.", "error");
  }
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;

  if (password.length < 6) {
    showMessage("Password must be at least 6 characters.", "error");
    return;
  }

  if (password !== confirm) {
    showMessage("The passwords do not match.", "error");
    return;
  }

  save.disabled = true;
  save.textContent = "CHANGING PASSWORD...";

  try {
    const { data: sessionData } = await client.auth.getSession();
    const user = sessionData.session?.user;

    if (!user) throw new Error("Your administrator session has expired. Please sign in again.");

    const { data: admin, error: adminError } = await client
      .from("gallery_admins")
      .select("user_id")
      .eq("user_id", user.id)
      .maybeSingle();

    if (adminError) throw adminError;
    if (!admin) throw new Error("Administrator access required.");

    const { error } = await client.auth.updateUser({ password });
    if (error) throw error;

    showMessage(
      "Admin password changed successfully. You can continue using Gallery Administration.",
      "success"
    );

    document.getElementById("password").value = "";
    document.getElementById("confirm").value = "";
  } catch (error) {
    showMessage(error.message || "Unable to change the administrator password.", "error");
  } finally {
    save.disabled = false;
    save.textContent = "CHANGE ADMIN PASSWORD";
  }
});

back.addEventListener("click", () => {
  window.location.href = "admin.html";
});

init();
</script>
</body>
</html>
